name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

  # The unit tests run against the working tree, so they can't see a module
  # missing from the Dockerfile's COPY. Building the image doesn't catch it
  # either - the file is only missing at runtime - so we invoke the container
  # once and check it renders.
  docker:
    name: Build and invoke the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker build -t image-generator .

      - name: Invoke the handler in the built image
        run: |
          docker run -d -p 9000:8080 --name image-generator image-generator
          trap 'docker logs image-generator; docker rm -f image-generator > /dev/null' EXIT

          endpoint=http://localhost:9000/2015-03-31/functions/function/invocations

          # The runtime interface emulator isn't up the instant the container is.
          ready=""
          for _ in $(seq 30); do
            if curl --silent --fail --max-time 2 "$endpoint" -d '{}' > /dev/null; then
              ready=yes
              break
            fi
            sleep 1
          done
          test -n "$ready" || { echo "container never accepted an invocation"; exit 1; }

          # An unmappable path is enough: it proves every require resolved and
          # the handler ran, without needing to reach the internal ALB.
          response=$(curl --silent --fail "$endpoint" -d '{"rawPath": "/nonsense"}')
          echo "$response"

          # The emulator answers 200 even when the handler fails to initialise,
          # so the body is what actually distinguishes "ran and rejected the
          # path" from "a module the Dockerfile forgot to COPY". The latter
          # comes back as an errorType/errorMessage object instead.
          echo "$response" | jq --exit-status '.statusCode == 500' > /dev/null
          echo "$response" | jq --exit-status '.body | test("Could not map raw path")' > /dev/null
